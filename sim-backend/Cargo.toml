[package]
name = "neuronet"
version = "0.1.0"
authors = ["Zander Baker <zanderbaker100@gmail.com>"]
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lib]
name="nn_lib"
crate-type = ["rlib", "dylib"]

[dependencies]
rand = "0.10.0"
getrandom = { version = "0.4.1", features = ["wasm_js"] }
generational-arena = "0.2.9"
hex = "0.4.3"
